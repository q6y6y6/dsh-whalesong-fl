[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-studio-bridge"
version = "0.1.0"
description = "FL Studio MIDI and Piano Roll bridge used by fl-melody"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Karlo" },
    { name = "dsh-flstudio contributors" },
]
keywords = ["fl-studio", "midi", "piano-roll", "daw"]
dependencies = [
    "mido>=1.3.0",
    "python-rtmidi>=1.5.0",
    "pynput>=1.7",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fl_studio_mcp"]
