# dsh-whalesong-fl bundle: connect the local FL Studio MCP server.
#
# Generated by scripts/setup.py. Keep `command` on the project virtualenv so
# mido/python-rtmidi stay pinned.
- insert:
    - id: fl-studio-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: fl
        transport: stdio
        command: /Users/quyouyang/Documents/deepseek-harness/dsh_FLmcp/.venv/bin/python
        args: ['-m', 'fl_melody.server']
        cwd: /Users/quyouyang/Documents/deepseek-harness/dsh_FLmcp
        toolCallTimeoutMs: 30000
        failOnStartupError: false
